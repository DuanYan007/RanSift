name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[static]'
      - run: python -m unittest discover -s tests
      - run: ransift validate --sample-dir examples/synthetic-sample --full
      - run: ransift analyze --sample-dir examples/synthetic-sample --output prepared-example --prepare-only
