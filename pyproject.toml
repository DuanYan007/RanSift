[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ransift"
version = "0.1.0.dev0"
description = "Ransomware behavioral investigation from execution logs"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["openai>=1.0"]

[project.optional-dependencies]
static = ["pefile>=2023.2.7"]

[project.scripts]
ransift = "ransift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ransift = ["resources/*.json"]
